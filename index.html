<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookly - Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
    <div class="login-card">
        <div class="logo-container">
            <div class="dummy-logo">📚</div>
            <h2>Bookly</h2>
            <p>Silakan login untuk mengakses sistem</p>
        </div>
        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" required placeholder="Contoh: rina@gmail.com / siti@gmail.com">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-primary btn-block">Login</button>
        </form>
        <div class="login-actions">
            <button type="button" class="btn-link" onclick="openModal('forgotModal')">Lupa Password?</button>
            <span>|</span>
            <button type="button" class="btn-link" onclick="openModal('registerModal')">Daftar Akun</button>
        </div>
    </div>

    <!-- Modal Lupa Password -->
    <div id="forgotModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('forgotModal')">&times;</span>
            <h3>Lupa Password</h3>
            <p>Masukkan email Anda untuk reset password.</p>
            <form onsubmit="handleModalSubmit(event, 'Instruksi reset password telah dikirim ke email Anda!')">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" required placeholder="email@domain.com">
                </div>
                <button type="submit" class="btn btn-primary btn-block">Kirim Link Reset</button>
            </form>
        </div>
    </div>

    <!-- Modal Daftar -->
    <div id="registerModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('registerModal')">&times;</span>
            <h3>Daftar Akun Baru</h3>
            <form onsubmit="handleModalSubmit(event, 'Pendaftaran berhasil! Silakan login dengan akun baru Anda.')">
                <div class="form-group">
                    <label>Nama Lengkap</label>
                    <input type="text" required placeholder="Nama Anda">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" required placeholder="email@domain.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn btn-primary btn-block">Daftar Sekarang</button>
            </form>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
